<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVT Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 120px; }
        button { background: #e74c3c; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #c0392b; }
        #login-section, #admin-section { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="login-section">
        <h2>Admin Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Shiga</button>
        </form>
    </div>

    <!-- Admin Panel Section -->
    <div id="admin-section">
        <h2>Wallafa Sabon Labari</h2>
        <form id="news-form">
            <div class="form-group">
                <label>Taken Labari (Title)</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Rukuni (Category)</label>
                <select id="category">
                    <option value="Labarai">Labarai</option>
                    <option value="Wasanni">Wasanni</option>
                    <option value="Sanarwa">Sanarwa</option>
                    <option value="Al'adu">Al'adu</option>
                </select>
            </div>
            <div class="form-group">
                <label>Hoton Labari (Image)</label>
                <!-- Mun saka accept image domin karɓar kowane irin hoto -->
                <input type="file" id="image" accept="image/*">
            </div>
            <div class="form-group">
                <label>Bayanan Labari (Content)</label>
                <textarea id="content" required></textarea>
            </div>
            <button type="submit">Wallafa Labari</button>
        </form>
        <br>
        <button onclick="logout()" style="background: #333;">Fita (Logout)</button>
    </div>
</div>

<script>
    // Duba ko an riga an yi login
    if (localStorage.getItem('dvt_auth') === 'true') {
        document.getElementById('admin-section').style.display = 'block';
    } else {
        document.getElementById('login-section').style.display = 'block';
    }

    // Ayyukan Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('dvt_auth', 'true');
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'block';
        } else {
            alert(data.message || 'Kuskure wajen shiga!');
        }
    });

    // Wallafa Labari tare da Hoto ta hanyar Base64 a Frontend
    document.getElementById('news-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const content = document.getElementById('content').value;
        const imageFile = document.getElementById('image').files[0];

        let imageBase64 = null;

        if (imageFile) {
            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onload = async function () {
                imageBase64 = reader.result;
                await sendNewsData(title, category, content, imageBase64);
            };
        } else {
            await sendNewsData(title, category, content, null);
        }
    });

    async function sendNewsData(title, category, content, image) {
        const res = await fetch('/api/news', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category, content, image })
        });
        const data = await res.json();
        if (data.success) {
            alert('An wallafa labarin da nasara!');
            location.reload();
        } else {
            alert('Kuskure: ' + data.message);
        }
    }

    function logout() {
        localStorage.removeItem('dvt_auth');
        location.reload();
    }
</script>

</body>
</html>
