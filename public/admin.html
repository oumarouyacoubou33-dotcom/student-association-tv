<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVT Admin Panel - Cikakke</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 750px; background: #1e293b; padding: 30px; margin: 20px auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2, h3 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        input[type="text"], select, textarea, input[type="file"], input[type="password"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 15px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { height: 120px; resize: vertical; }
        button { background: #0284c7; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #0369a1; }
        .logout-btn { background: #dc2626; margin-top: 15px; }
        .logout-btn:hover { background: #b91c1c; }
        #login-section, #admin-section { display: none; }
        .preview-img { margin-top: 10px; max-width: 100%; height: 150px; object-fit: cover; border-radius: 6px; display: none; }
        
        .news-list { margin-top: 30px; border-top: 2px solid #334155; padding-top: 20px; }
        .news-item { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .news-info h4 { margin: 0 0 5px 0; color: #f1c40f; }
        .news-info p { margin: 0; font-size: 13px; color: #94a3b8; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="login-section">
        <h2>Shiga Admin</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Shigar da username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Shigar da password">
            </div>
            <button type="submit">Shiga Ciki</button>
        </form>
    </div>

    <!-- Admin Panel Section -->
    <div id="admin-section">
        <h2>Wallafa Sabon Labari</h2>
        <form id="news-form">
            <div class="form-group">
                <label>Taken Labari (Title)</label>
                <input type="text" id="title" required placeholder="Misali: Taron Ɗalibai na Yau">
            </div>
            <div class="form-group">
                <label>Rukuni (Category)</label>
                <!-- An saita su da Hausa zalla daidai da abin da babban shafin ke buƙata -->
                <select id="category">
                    <option value="Labarai">Labarai</option>
                    <option value="Wasanni">Wasanni</option>
                    <option value="Sanarwa">Sanarwa</option>
                    <option value="Al'adu">Al'adu</option>
                </select>
            </div>
            <div class="form-group">
                <label>Hoton Labari (Image)</label>
                <input type="file" id="image" accept="image/*" onchange="previewImage(event)">
                <img id="img-preview" class="preview-img" alt="Preview">
            </div>
            <div class="form-group">
                <label>Cikakken Bayani (Content)</label>
                <textarea id="content" required placeholder="Rubuta bayanin labari anan..."></textarea>
            </div>
            <button type="submit">Wallafa Labari Now</button>
        </form>

        <div class="news-list">
            <h3>Duk Labaran da Aka Wallafa</h3>
            <div id="admin-news-container">
                <p style="text-align: center; color: #94a3b8;">Ana lodi labarai...</p>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Fita (Logout)</button>
    </div>
</div>

<script>
    if (localStorage.getItem('dvt_auth') === 'true') {
        document.getElementById('admin-section').style.display = 'block';
        loadAdminNews();
    } else {
        document.getElementById('login-section').style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('dvt_auth', 'true');
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadAdminNews();
            } else {
                alert(data.message || 'Kuskure a Username ko Password!');
            }
        } catch (err) {
            alert('Matsalar sadarwa da server!');
        }
    });

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('img-preview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    document.getElementById('news-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const content = document.getElementById('content').value;
        const imageFile = document.getElementById('image').files[0];

        if (imageFile) {
            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onload = async function () {
                await sendNewsData(title, category, content, reader.result);
            };
        } else {
            await sendNewsData(title, category, content, null);
        }
    });

    async function sendNewsData(title, category, content, image) {
        try {
            const res = await fetch('/api/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, content, image })
            });
            const data = await res.json();
            if (data.success) {
                alert('An wallafa labarin da nasara!');
                location.reload();
            } else {
                alert('Kuskure: ' + data.message);
            }
        } catch (err) {
            alert('An samu matsala wajen tura labarin.');
        }
    }

    async function loadAdminNews() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            const container = document.getElementById('admin-news-container');
            
            if (data.success && data.data.length > 0) {
                container.innerHTML = '';
                data.data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <div class="news-info">
                            <h4>${item.title}</h4>
                            <p>Rukuni: <b>${item.category || 'General'}</b> | KWANATA: ${item.date_published || 'N/A'}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteNews(${item.id})">Share</button>
                    `;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8;">Babu wani labari da aka wallafa tukuna.</p>';
            }
        } catch (err) {
            console.error('Kuskure wajen loda labarai:', err);
        }
    }

    async function deleteNews(id) {
        if (confirm('Ka tabbata kana son share wannan labarin?')) {
            try {
                const res = await fetch(`/api/news/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert('An share labarin!');
                    loadAdminNews();
                } else {
                    alert('Kuskure wajen share labari.');
                }
            } catch (err) {
                alert('Matsalar sadarwa da server.');
            }
        }
    }

    function logout() {
        localStorage.removeItem('dvt_auth');
        location.reload();
    }
</script>

</body>
</html>
